
name: Laundry Timer

on:
  repository_dispatch:
    # Added the two specific dryer types here
    types: [washing_started, dryer_first_started, dryer_last_started]

jobs:
  washing_machine:
    if: github.event.action == 'washing_started'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm washing started
        run: |
          curl -X POST https://discord.com/api/webhooks/1493073899594711092/LHGSBAGL6dFuIeN_LeJrFl-nWzT1qROur6cS654S3IGtKDGqEPUiEymjmMdWh_GG0LSY \
            -H "Content-Type: application/json" \
            -d '{"content":"⏳ Washing timer started! 60 mins remaining."}'
      - name: Wait 60 minutes
        run: sleep 3600
      - name: Send washing webhook
        run: |
          curl -X POST https://discord.com/api/webhooks/1493073899594711092/LHGSBAGL6dFuIeN_LeJrFl-nWzT1qROur6cS654S3IGtKDGqEPUiEymjmMdWh_GG0LSY \
            -H "Content-Type: application/json" \
            -d '{"content":"🧺 Washing machine finished!"}'

  dryer_first_cycle:
    if: github.event.action == 'dryer_first_started'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm first dryer cycle
        run: |
          curl -X POST https://discord.com/api/webhooks/1493074210573123634/8EGfia9ZNdZqBP295g8WTCTyA3FqENADaG_WL3MIX4QEk2Sll7lMucDilec-dzbtSXY6 \
            -H "Content-Type: application/json" \
            -d '{"content":"⏳ **Dryer: FIRST cycle started.** (90 mins)"}'
      - name: Wait 90 minutes
        run: sleep 5400
      - name: Send completion webhook
        run: |
          curl -X POST https://discord.com/api/webhooks/1493074210573123634/8EGfia9ZNdZqBP295g8WTCTyA3FqENADaG_WL3MIX4QEk2Sll7lMucDilec-dzbtSXY6 \
            -H "Content-Type: application/json" \
            -d '{"content":"⚠️ First dryer cycle done! Needs a second flip/restart?"}'

  dryer_last_cycle:
    if: github.event.action == 'dryer_last_started'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm last dryer cycle
        run: |
          curl -X POST https://discord.com/api/webhooks/1493074210573123634/8EGfia9ZNdZqBP295g8WTCTyA3FqENADaG_WL3MIX4QEk2Sll7lMucDilec-dzbtSXY6 \
            -H "Content-Type: application/json" \
            -d '{"content":"⏳ **Dryer: FINAL cycle started.** (90 mins)"}'
      - name: Wait 90 minutes
        run: sleep 5400
      - name: Send completion webhook
        run: |
          curl -X POST https://discord.com/api/webhooks/1493074210573123634/8EGfia9ZNdZqBP295g8WTCTyA3FqENADaG_WL3MIX4QEk2Sll7lMucDilec-dzbtSXY6 \
            -H "Content-Type: application/json" \
            -d '{"content":"✅ Dryer finished! Everything should be dry now."}'
