name: Laundry Timer

on:
  repository_dispatch:
    types: [washing_started, dryer_started]

jobs:
  washing_machine:
    if: github.event.action == 'washing_started'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm washing started
        run: |
          curl -X POST https://discord.com/api/webhooks/1493073899594711092/LHGSBAGL6dFuIeN_LeJrFl-nWzT1qROur6cS654S3IGtKDGqEPUiEymjmMdWh_GG0LSY \
            -H "Content-Type: application/json" \
            -d '{"content":"⏳ Washing timer started! I will remind you in 60 minutes."}'
      - name: Wait 60 minutes
        run: sleep 3600
      - name: Send washing webhook
        run: |
          curl -X POST https://discord.com/api/webhooks/1493073899594711092/LHGSBAGL6dFuIeN_LeJrFl-nWzT1qROur6cS654S3IGtKDGqEPUiEymjmMdWh_GG0LSY \
            -H "Content-Type: application/json" \
            -d '{"content":"🧺 Washing machine finished!"}'

  dryer:
    if: github.event.action == 'dryer_started'
    runs-on: ubuntu-latest
    steps:
      - name: Confirm dryer started
        run: |
          curl -X POST ${{ secrets.WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{"content":"⏳ Dryer timer started! I will remind you in 90 minutes."}'
      - name: Wait 90 minutes
        run: sleep 5400
      - name: Send dryer webhook
        run: |
          curl -X POST ${{ secrets.WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d '{"content":"🧺 Dryer finished!"}'
